services:
  merger:
    build: .
    container_name: va-track-merger
    ports:
      - "5174:5174"
    volumes:
      # Your videos. Change the left side if the files live elsewhere,
      # e.g.:  - "D:/Videos:/media:ro"
      - ./media:/media:ro
      # Intermediate data + exported files (persists after the container stops)
      - ./work:/work
    environment:
      - MEDIA_DIR=/media
      - WORK_DIR=/work
    restart: unless-stopped

  # One-shot: builds the native window into dist/ and exits. Needs no Node on
  # the host. Behind a profile so a plain `docker compose up` ignores it.
  #   docker compose --profile desktop run --rm desktop-build
  desktop-build:
    profiles: ["desktop"]
    build:
      context: .
      dockerfile: desktop/Dockerfile
      args:
        # swap for linux-x64 / darwin-arm64 to build the window for another OS
        ELECTRON_PLATFORM: win32-x64
    volumes:
      - ./dist:/out
